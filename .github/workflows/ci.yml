name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint
        run: ruff check src tests

      # data/ and reports/ml_scores.csv are git-ignored, so a fresh checkout has
      # neither. Fit the ML layer too, otherwise test_ml_only/test_hybrid skip.
      - name: Generate data
        run: make data

      - name: Fit ML layer
        run: make train

      - name: Tests
        run: pytest -q

      - name: Eval
        run: make eval

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
